<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif; fill: #000000; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .title { font-size: 42px; font-weight: bold; }
      .subtitle { font-size: 20px; fill: #333333; }
      .panel-title { font-size: 28px; font-weight: bold; }
      .panel-desc { font-size: 16px; font-style: italic; fill: #555555; }
      .box-title { font-size: 21px; font-weight: bold; }
      .box-text { font-size: 15px; fill: #333333; }
      .box-tiny { font-size: 13px; fill: #333333; }
      .box-tiny-bold { font-size: 13px; font-weight: bold; }
      .box-mono { font-size: 14px; font-weight: bold; }
      .legend-text { font-size: 12px; fill: #333333; }
      .flow-arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow-solid); stroke-linecap: round; stroke-linejoin: round; }
      .flow-dashed { stroke: #666666; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-dashed); stroke-linecap: round; stroke-linejoin: round; }
      .panel-border { stroke: #000000; stroke-width: 2.5; fill: #ffffff; }
      .box-border { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .box-gray { fill: #f5f5f5; stroke: #000000; stroke-width: 1.5; }
      .box-dark-gray { fill: #e0e0e0; stroke: #000000; stroke-width: 1.5; }
    </style>
    <marker id="arrow-solid" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#000000"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="2400" height="1700" fill="#ffffff"/>

  <rect x="80" y="60" width="2240" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="140" y="114" class="title">VCF/BCF 多样本 .gsc 二进制结构</text>
  <text x="140" y="150" class="subtitle">对应 Excel：VCF层次结构 / VCF_gsc二进制结构。重点看：文件开头的两个位置值如何找到 main archive、lossless part2 与 SDSL tail。</text>
  <rect x="1845" y="88" width="435" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="1872" cy="113" r="5" fill="#000000"/>
  <text x="1888" y="118" class="legend-text">必选</text>
  <circle cx="1975" cy="113" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1991" y="118" class="legend-text">条件/兼容</text>
  <line x1="2108" y1="113" x2="2160" y2="113" class="flow-dashed"/>
  <text x="2172" y="118" class="legend-text">引用/跳转</text>
  <text x="1870" y="140" class="legend-text">黑色填充模块表示解压时必须先读取的入口。</text>

  <rect x="80" y="220" width="580" height="1390" class="panel-border"/>
  <rect x="120" y="260" width="16" height="40" fill="#000000"/>
  <text x="150" y="290" class="panel-title">文件字节布局</text>
  <text x="150" y="320" class="panel-desc">真实字节顺序；多样本 .gsc 没有顶层魔数/版本。</text>

  <rect x="130" y="365" width="480" height="130" class="box-dark-gray"/>
  <text x="160" y="402" class="box-title">1. TOP_HEADER</text>
  <text x="160" y="430" class="box-text">固定 17 bytes：模式与两个位置值。</text>
  <text x="160" y="456" class="box-mono">bool + uint64_t + uint64_t</text>
  <text x="160" y="478" class="box-tiny-bold">入口字段本身不带魔数/版本。</text>
  <circle cx="588" cy="395" r="5" fill="#000000"/>

  <path d="M370 505 L370 545" class="flow-arrow"/>

  <rect x="130" y="555" width="480" height="385" class="box-border"/>
  <text x="160" y="592" class="box-title">2. MAIN_ARCHIVE</text>
  <text x="160" y="620" class="box-text">offset=17 到 other_fields_offset。</text>
  <text x="160" y="648" class="box-tiny">主要数据区，保存 GT 全局索引、元信息和 fixed chunks。</text>
  <rect x="160" y="682" width="420" height="52" class="box-gray"/>
  <text x="180" y="715" class="box-mono">chunk_streams / basic params</text>
  <rect x="160" y="752" width="420" height="52" class="box-gray"/>
  <text x="180" y="785" class="box-mono">copy 来源位流 / 范围索引</text>
  <rect x="160" y="822" width="420" height="52" class="box-gray"/>
  <text x="180" y="855" class="box-mono">列分块 / 样本重排 / 元信息</text>
  <rect x="160" y="892" width="420" height="30" class="box-dark-gray"/>
  <text x="180" y="912" class="box-mono">fixed-fields chunk 内容</text>
  <circle cx="588" cy="745" r="5" fill="#000000"/>

  <path d="M370 950 L370 990" class="flow-arrow"/>

  <rect x="130" y="1000" width="480" height="240" class="box-border"/>
  <text x="160" y="1038" class="box-title">3. LOSSLESS_PART2</text>
  <text x="160" y="1066" class="box-text">仅 lossless 文件存在。</text>
  <text x="160" y="1094" class="box-mono">[other_fields_offset, sdsl_offset)</text>
  <rect x="160" y="1124" width="420" height="52" class="box-gray"/>
  <text x="180" y="1157" class="box-mono">part2_params + key_i_size/data</text>
  <circle cx="588" cy="1030" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <path d="M370 1250 L370 1295" class="flow-arrow"/>

  <rect x="130" y="1305" width="480" height="165" class="box-dark-gray"/>
  <text x="160" y="1343" class="box-title">4. SDSL_TAIL</text>
  <text x="160" y="1371" class="box-text">从 sdsl_offset 开始的 GT zero/copy 位图。</text>
  <text x="160" y="1398" class="box-mono">zeros[2] + copies[2]</text>
  <text x="160" y="1425" class="box-tiny">每项均为 sdsl::rrr_vector&lt;&gt;</text>
  <circle cx="588" cy="1335" r="5" fill="#000000"/>

  <rect x="690" y="220" width="40" height="1390" fill="#ffffff"/>

  <rect x="760" y="220" width="1560" height="1390" class="panel-border"/>
  <rect x="800" y="260" width="16" height="40" fill="#000000"/>
  <text x="830" y="290" class="panel-title">结构展开：按文件位置读取的 .gsc</text>
  <text x="830" y="320" class="panel-desc">中间留白只放跨面板箭头；右侧按 Excel 字段明细展开。</text>

  <path d="M610 430 L735 430 L735 390 L800 390" class="flow-arrow"/>
  <path d="M610 745 L735 745 L735 615 L800 615" class="flow-arrow"/>
  <path d="M610 1120 L735 1120 L735 1342 L780 1342 L780 1405 L800 1405" class="flow-arrow"/>
  <path d="M610 1387 L735 1387 L735 1342 L1720 1342 L1720 1390 L1730 1390" class="flow-arrow"/>

  <rect x="800" y="355" width="1480" height="135" class="box-border"/>
  <text x="830" y="392" class="box-title">TOP_HEADER：文件入口字段</text>
  <text x="830" y="420" class="box-text">解压端先读取 3 个字段，然后找到 main archive、part2 和 SDSL tail 三个区域。</text>
  <rect x="1060" y="438" width="230" height="34" class="box-dark-gray"/>
  <text x="1175" y="461" text-anchor="middle" class="box-mono">mode_type</text>
  <rect x="1320" y="438" width="310" height="34" class="box-dark-gray"/>
  <text x="1475" y="461" text-anchor="middle" class="box-mono">other_fields_offset</text>
  <rect x="1660" y="438" width="250" height="34" class="box-dark-gray"/>
  <text x="1785" y="461" text-anchor="middle" class="box-mono">sdsl_offset</text>
  <text x="1945" y="461" class="box-tiny-bold">lossless/lossy 解压模式必须匹配 mode_type。</text>

  <rect x="800" y="535" width="1480" height="320" class="box-border"/>
  <text x="830" y="574" class="box-title">MAIN_ARCHIVE：位置表 + GT 参数 + 元信息 + fixed chunks</text>
  <text x="830" y="602" class="box-text">这里按写入顺序串联；读取指定 fixed chunk 时，需要先查 chunk_streams 里的位置。</text>

  <rect x="830" y="635" width="280" height="86" class="box-gray"/>
  <text x="850" y="664" class="box-mono">chunk_streams</text>
  <text x="850" y="688" class="box-tiny">chunks_streams_size</text>
  <text x="850" y="708" class="box-tiny">[actual_pos, offset] × N</text>

  <path d="M1110 678 L1150 678" class="flow-arrow"/>

  <rect x="1160" y="635" width="280" height="86" class="box-gray"/>
  <text x="1180" y="664" class="box-mono">basic + copy 来源</text>
  <text x="1180" y="688" class="box-tiny">ploidy, row/col limits, vec_len</text>
  <text x="1180" y="708" class="box-tiny">used_bits_cp + bitstream</text>

  <path d="M1440 678 L1480 678" class="flow-arrow"/>

  <rect x="1490" y="635" width="320" height="86" class="box-gray"/>
  <text x="1510" y="664" class="box-mono">范围信息 + 列分块</text>
  <text x="1510" y="688" class="box-tiny">chunks_min_pos[] / where_chrom[]</text>
  <text x="1510" y="708" class="box-tiny">n_col_blocks + column ranges</text>

  <path d="M1810 678 L1850 678" class="flow-arrow"/>

  <rect x="1860" y="635" width="380" height="86" class="box-gray"/>
  <text x="1880" y="664" class="box-mono">样本重排数据流</text>
  <text x="1880" y="688" class="box-tiny">legacy: row_block_id + vint bytes</text>
  <text x="1880" y="708" class="box-tiny">tiled: row_block_id + col_block_id + bytes</text>

  <rect x="830" y="755" width="440" height="72" class="box-dark-gray"/>
  <text x="850" y="785" class="box-mono">元信息</text>
  <text x="850" y="810" class="box-tiny">GSC_META_MAGIC + 压缩后端 + 压缩后的 header/sample names</text>

  <rect x="1300" y="755" width="940" height="72" class="box-dark-gray"/>
  <text x="1320" y="785" class="box-mono">fixed-fields chunk 内容</text>
  <text x="1320" y="810" class="box-tiny-bold">按 chunk 顺序拼接；最终 fixed chunk 无长度前缀；chunk 内部见 GSCF V2。</text>

  <path d="M1770 827 L1770 880" class="flow-dashed"/>

  <rect x="800" y="890" width="1480" height="440" class="box-border"/>
  <rect x="800" y="890" width="1480" height="50" class="box-dark-gray"/>
  <text x="830" y="923" class="box-title">GSCF V2：Fixed Fields Chunk 内部</text>

  <rect x="830" y="970" width="300" height="140" class="box-gray"/>
  <text x="850" y="1000" class="box-mono">chunk_header</text>
  <text x="850" y="1026" class="box-tiny">magic = 0x46435347 ("GSCF")</text>
  <text x="850" y="1048" class="box-tiny">version = 2</text>
  <text x="850" y="1070" class="box-tiny">total_variants</text>
  <text x="850" y="1092" class="box-tiny">row_block_count, flags</text>

  <path d="M1130 1040 L1185 1040" class="flow-arrow"/>

  <rect x="1195" y="970" width="415" height="250" class="box-gray"/>
  <text x="1215" y="1000" class="box-mono">row_block_directory</text>
  <text x="1215" y="1026" class="box-tiny">每个 row_block 一个目录项：</text>
  <text x="1215" y="1054" class="box-tiny">variant_count / first_pos / last_pos</text>
  <text x="1215" y="1076" class="box-tiny">chrom_off / chrom_size</text>
  <text x="1215" y="1098" class="box-tiny">pos_off / pos_size</text>
  <text x="1215" y="1120" class="box-tiny">id/ref/alt/qual off+size</text>
  <text x="1215" y="1142" class="box-tiny-bold">gt_off / gt_size (V2)</text>
  <text x="1215" y="1180" class="box-tiny">范围查询直接按 first_pos/last_pos 选 row_block。</text>

  <path d="M1610 1095 L1665 1095" class="flow-arrow"/>

  <rect x="1675" y="970" width="565" height="250" class="box-gray"/>
  <text x="1695" y="1000" class="box-mono">data_region（数据区）</text>
  <text x="1695" y="1026" class="box-tiny">目录中的 off/size 会指向这里的各字段内容。</text>
  <rect x="1695" y="1050" width="510" height="62" class="box-border"/>
  <text x="1710" y="1074" class="box-mono">内容顺序</text>
  <text x="1710" y="1096" class="box-tiny">CHROM -> POS -> ID -> REF -> ALT -> QUAL -> GT</text>
  <text x="1695" y="1140" class="box-tiny-bold">字符串列：append_str()，NUL 结尾。</text>
  <text x="1695" y="1164" class="box-tiny-bold">POS：append(int64 delta)，十进制 ASCII + NUL。</text>
  <text x="1695" y="1188" class="box-tiny-bold">GT：稀疏索引内容 + 1-byte codec marker。</text>

  <rect x="830" y="1244" width="1410" height="58" class="box-border"/>
  <text x="850" y="1279" class="box-tiny-bold">兼容分支：旧 fixed-fields chunk 不以 GSCF magic 起始，而是 [no_variants] + 7 个 [size,data]；无 row_block 目录。</text>

  <rect x="800" y="1360" width="900" height="185" class="box-border"/>
  <text x="830" y="1397" class="box-title">LOSSLESS_PART2：FILTER / INFO / FORMAT 多流容器</text>
  <rect x="830" y="1425" width="240" height="78" class="box-gray"/>
  <text x="850" y="1455" class="box-mono">part2_params</text>
  <text x="850" y="1477" class="box-tiny">actual_variants, key table</text>
  <text x="850" y="1497" class="box-tiny">压缩后端 + FORMAT 字典数据</text>
  <rect x="1100" y="1425" width="260" height="78" class="box-gray"/>
  <text x="1120" y="1455" class="box-mono">key_i_size / key_i_data</text>
  <text x="1120" y="1477" class="box-tiny">每个 key 的 size/data 子流</text>
  <text x="1120" y="1497" class="box-tiny">FILTER / INFO / FORMAT</text>
  <rect x="1390" y="1425" width="280" height="78" class="box-dark-gray"/>
  <text x="1410" y="1455" class="box-mono">File_Handle_2 footer</text>
  <text x="1410" y="1481" class="box-tiny">stream_name, part 位置/大小, footer_size</text>

  <rect x="1730" y="1360" width="510" height="185" class="box-border"/>
  <text x="1760" y="1397" class="box-title">SDSL_TAIL：GT 全零/copy 位图</text>
  <rect x="1760" y="1425" width="210" height="48" class="box-gray"/>
  <text x="1780" y="1455" class="box-mono">zeros_only[0/1]</text>
  <rect x="2000" y="1425" width="210" height="48" class="box-gray"/>
  <text x="2020" y="1455" class="box-mono">copies[0/1]</text>
  <text x="1760" y="1505" class="box-tiny-bold">copy 来源差值位流位于 MAIN_ARCHIVE，不在 SDSL tail。</text>

  <rect x="80" y="1640" width="2240" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="1663" class="box-tiny">源码依据：src/compressor.cpp::writeCompressFlie(), src/decompression_reader.cpp::OpenReading()/readFixedFields(), src/file_handle.cpp, src/variant.h</text>
</svg>
