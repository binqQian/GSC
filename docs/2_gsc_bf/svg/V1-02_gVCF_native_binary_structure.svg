<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif; fill: #000000; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .title { font-size: 42px; font-weight: bold; }
      .subtitle { font-size: 20px; fill: #333333; }
      .panel-title { font-size: 28px; font-weight: bold; }
      .panel-desc { font-size: 16px; font-style: italic; fill: #555555; }
      .box-title { font-size: 21px; font-weight: bold; }
      .box-text { font-size: 15px; fill: #333333; }
      .box-tiny { font-size: 13px; fill: #333333; }
      .box-tiny-bold { font-size: 13px; font-weight: bold; }
      .box-mono { font-size: 14px; font-weight: bold; }
      .tag-text { font-size: 12px; font-weight: bold; text-transform: uppercase; }
      .flow-arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow-solid); stroke-linecap: round; stroke-linejoin: round; }
      .flow-dashed { stroke: #666666; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-dashed); stroke-linecap: round; stroke-linejoin: round; }
      .panel-border { stroke: #000000; stroke-width: 2.5; fill: #ffffff; }
      .box-border { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .box-gray { fill: #f5f5f5; stroke: #000000; stroke-width: 1.5; }
      .box-dark-gray { fill: #e0e0e0; stroke: #000000; stroke-width: 1.5; }
      .lane-label { font-size: 12px; fill: #555555; }
    </style>
    <marker id="arrow-solid" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#000000" />
    </marker>
    <marker id="arrow-dashed" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#666666" />
    </marker>
  </defs>

  <rect width="2400" height="1700" fill="#ffffff"/>

  <rect x="80" y="60" width="2240" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="140" y="114" class="title">单样本 native gVCF 二进制结构</text>
  <text x="140" y="150" class="subtitle">对应 Excel：gVCF层次结构 / gVCF_native二进制结构。左侧是物理文件布局，右侧展开 block、field wrapper 和 footer 索引。</text>
  <rect x="1945" y="94" width="335" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="1968" cy="116" r="5" fill="#000000"/>
  <text x="1984" y="121" class="box-tiny">必选</text>
  <circle cx="2066" cy="116" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="2082" y="121" class="box-tiny">条件/版本分支</text>
  <line x1="2206" y1="116" x2="2256" y2="116" class="flow-dashed"/>
  <text x="2266" y="121" class="box-tiny">引用/跳转</text>

  <rect x="80" y="220" width="580" height="1390" class="panel-border"/>
  <rect x="120" y="260" width="16" height="40" fill="#000000"/>
  <text x="150" y="290" class="panel-title">文件物理布局</text>
  <text x="150" y="320" class="panel-desc">native gVCF 有显式文件魔数和版本；文件尾最后 8 字节是 footer_offset。</text>

  <rect x="130" y="365" width="480" height="230" class="box-dark-gray"/>
  <text x="160" y="402" class="box-title">1. FILE_HEADER</text>
  <text x="160" y="430" class="box-text">文件头：识别、后端、header 文本和样本列表。</text>
  <rect x="160" y="456" width="420" height="42" class="box-border"/>
  <text x="180" y="483" class="box-mono">magic + version + backend_id + num_samples</text>
  <rect x="160" y="516" width="420" height="42" class="box-border"/>
  <text x="180" y="543" class="box-mono">header_flag + header payload + sample_names[] + placeholder</text>
  <circle cx="588" cy="395" r="5" fill="#000000"/>

  <path d="M370 605 L370 650" class="flow-arrow"/>

  <rect x="130" y="660" width="480" height="340" class="box-border"/>
  <text x="160" y="697" class="box-title">2. BLOCK_AREA</text>
  <text x="160" y="725" class="box-text">块区：`[block_size][block_payload]` 重复 N 次。</text>
  <rect x="160" y="755" width="420" height="60" class="box-gray"/>
  <text x="180" y="792" class="box-mono">block_size (uint32_t)</text>
  <rect x="160" y="835" width="420" height="120" class="box-gray"/>
  <text x="180" y="868" class="box-mono">block_payload = CompressedGVCFBlock</text>
  <text x="180" y="894" class="box-tiny">内部仍有 block magic/version</text>
  <text x="180" y="916" class="box-tiny">known fields + unknown fields</text>
  <text x="180" y="938" class="box-tiny">统一字段包装为 CompressedField</text>
  <circle cx="588" cy="725" r="5" fill="#000000"/>

  <path d="M370 1010 L370 1055" class="flow-arrow"/>

  <rect x="130" y="1065" width="480" height="260" class="box-border"/>
  <text x="160" y="1102" class="box-title">3. FILE_FOOTER</text>
  <text x="160" y="1130" class="box-text">集中存块偏移、总变体数和 V4 范围查询索引。</text>
  <rect x="160" y="1158" width="420" height="44" class="box-gray"/>
  <text x="180" y="1186" class="box-mono">num_blocks + block_offsets[] + total_variants</text>
  <rect x="160" y="1218" width="420" height="72" class="box-gray"/>
  <text x="180" y="1248" class="box-mono">num_indices + block_index_item[]</text>
  <text x="180" y="1272" class="box-tiny">每项: chrom_len, chrom, start_pos, end_pos, file_offset, variant_count</text>
  <circle cx="588" cy="1100" r="5" fill="#000000"/>

  <path d="M370 1335 L370 1380" class="flow-arrow"/>

  <rect x="130" y="1390" width="480" height="130" class="box-dark-gray"/>
  <text x="160" y="1427" class="box-title">4. footer_offset @ EOF</text>
  <text x="160" y="1455" class="box-text">文件最后 8 字节，指向 FILE_FOOTER 起始位置。</text>
  <text x="160" y="1483" class="box-mono">uint64_t at EOF</text>
  <circle cx="588" cy="1420" r="5" fill="#000000"/>

  <rect x="690" y="220" width="40" height="1390" fill="#ffffff"/>
  <text x="710" y="250" text-anchor="middle" class="lane-label" transform="rotate(90 710 250)">arrow lane: physical section to detail panel</text>

  <rect x="760" y="220" width="1560" height="1390" class="panel-border"/>
  <rect x="800" y="260" width="16" height="40" fill="#000000"/>
  <text x="830" y="290" class="panel-title">结构展开</text>
  <text x="830" y="320" class="panel-desc">箭头通过留白通道进入右侧模块，不与框体边缘重叠；布局与 Excel sheet 名称一一对应。</text>

  <path d="M610 480 L735 480 L735 390 L800 390" class="flow-arrow"/>
  <path d="M610 835 L735 835 L735 630 L800 630" class="flow-arrow"/>
  <path d="M610 1240 L735 1240 L735 1310 L800 1310" class="flow-arrow"/>
  <path d="M610 1455 L735 1455 L735 1510 L800 1510" class="flow-arrow"/>

  <rect x="800" y="355" width="1480" height="210" class="box-border"/>
  <text x="830" y="392" class="box-title">FILE_HEADER：文件入口与 header 文本分支</text>
  <text x="830" y="420" class="box-text">reader 先检查 GVCF_FILE_MAGIC，再按 version 处理 backend_id、header_flag 和 block index 兼容分支。</text>

  <rect x="840" y="452" width="500" height="78" class="box-gray"/>
  <text x="860" y="482" class="box-mono">固定字段</text>
  <text x="860" y="506" class="box-tiny">magic = 0x47564346, version, backend_id(V2+), num_samples</text>

  <rect x="1380" y="452" width="390" height="78" class="box-gray"/>
  <text x="1400" y="482" class="box-mono">header text</text>
  <text x="1400" y="506" class="box-tiny">V3+ : header_flag 控制 compressed/raw 两条分支</text>

  <rect x="1810" y="452" width="430" height="78" class="box-gray"/>
  <text x="1830" y="482" class="box-mono">sample_names + placeholder</text>
  <text x="1830" y="506" class="box-tiny">重复 [name_size][name]，最后补一个 uint64 占位</text>

  <rect x="800" y="595" width="1480" height="340" class="box-border"/>
  <text x="830" y="632" class="box-title">BLOCK_AREA：单个 block 的 envelope 与内部对象</text>
  <text x="830" y="660" class="box-text">块区重复模式非常规整：先是块长度，再是 CompressedGVCFBlock 序列化结果。</text>

  <rect x="830" y="694" width="300" height="72" class="box-dark-gray"/>
  <text x="850" y="724" class="box-mono">block envelope</text>
  <text x="850" y="748" class="box-tiny">[block_size:uint32_t][block_payload bytes]</text>

  <path d="M1130 730 L1185 730" class="flow-arrow"/>

  <rect x="1195" y="694" width="1045" height="210" class="box-gray"/>
  <text x="1215" y="724" class="box-mono">CompressedGVCFBlock</text>
  <rect x="1215" y="746" width="310" height="60" class="box-border"/>
  <text x="1235" y="773" class="box-mono">block header</text>
  <text x="1235" y="793" class="box-tiny">4-byte GVCF magic + block_version + variant_count + sample_count + flags</text>

  <rect x="1555" y="746" width="320" height="60" class="box-border"/>
  <text x="1575" y="773" class="box-mono">known fields</text>
  <text x="1575" y="793" class="box-tiny">chrom, pos, id, ref, alt, qual, filter, info_end, gt_*, dp, gq, min_dp, pl, ad</text>

  <rect x="1905" y="746" width="305" height="60" class="box-border"/>
  <text x="1925" y="773" class="box-mono">unknown fields</text>
  <text x="1925" y="793" class="box-tiny">unknown_info_count + items / unknown_format_count + items</text>

  <rect x="1215" y="828" width="995" height="54" class="box-dark-gray"/>
  <text x="1235" y="861" class="box-tiny-bold">所有字段统一包装为 CompressedField：method + original_count + data_size + data。</text>

  <path d="M1710 904 L1710 958" class="flow-dashed"/>

  <rect x="800" y="970" width="1480" height="300" class="box-border"/>
  <text x="830" y="1007" class="box-title">CompressedField 与典型字段 payload</text>
  <text x="830" y="1035" class="box-text">Excel 明细里的 `CompressedField wrapper` 与 `FIELD_PAYLOADS_AND_METHODS` 对应这里。</text>

  <rect x="830" y="1068" width="350" height="150" class="box-gray"/>
  <text x="850" y="1098" class="box-mono">CompressedField wrapper</text>
  <text x="850" y="1124" class="box-tiny">1. method : uint8 FieldCompressionMethod</text>
  <text x="850" y="1146" class="box-tiny">2. original_count : VarUint</text>
  <text x="850" y="1168" class="box-tiny">3. data_size : VarUint</text>
  <text x="850" y="1190" class="box-tiny-bold">4. data : bytes</text>

  <path d="M1180 1144 L1235 1144" class="flow-arrow"/>

  <rect x="1245" y="1068" width="470" height="150" class="box-gray"/>
  <text x="1265" y="1098" class="box-mono">data 内部的 backend wrapper</text>
  <text x="1265" y="1124" class="box-tiny">第 1 字节是 backend_flag：</text>
  <text x="1265" y="1146" class="box-tiny">0 = 后面直接跟字段编码 payload</text>
  <text x="1265" y="1168" class="box-tiny">1 = 后面跟 backend-compressed payload</text>
  <text x="1265" y="1190" class="box-tiny-bold">空字段 data_size=0 时没有 backend_flag。</text>

  <rect x="1745" y="1068" width="495" height="150" class="box-gray"/>
  <text x="1765" y="1098" class="box-mono">典型字段 payload 例子</text>
  <text x="1765" y="1124" class="box-tiny">POS: Delta [original_len][first_value][delta_count][delta...]</text>
  <text x="1765" y="1146" class="box-tiny">REF: exception list + packed 2-bit bases</text>
  <text x="1765" y="1168" class="box-tiny">ALT: Mask(first ALT) + extra_alts 列表</text>
  <text x="1765" y="1190" class="box-tiny">PL/AD: optimized v2 payload；GQ: PL prediction exceptions</text>

  <rect x="830" y="1230" width="1410" height="20" class="box-border"/>
  <text x="850" y="1244" class="box-tiny-bold">注意：unknown_info / unknown_format 使用 unordered_map 迭代，字段写出顺序不保证按名称排序。</text>

  <rect x="800" y="1285" width="1480" height="230" class="box-border"/>
  <text x="830" y="1322" class="box-title">FILE_FOOTER：块偏移表 + V4 范围查询索引</text>
  <text x="830" y="1350" class="box-text">footer 统一放在文件尾附近，最后再用 EOF 处的 footer_offset 回跳定位。</text>

  <rect x="830" y="1384" width="360" height="92" class="box-dark-gray"/>
  <text x="850" y="1414" class="box-mono">footer fixed area</text>
  <text x="850" y="1438" class="box-tiny">num_blocks + block_offsets[] + total_variants</text>
  <text x="850" y="1460" class="box-tiny">block_offsets 指向各自 block_size 字段</text>

  <rect x="1230" y="1384" width="610" height="92" class="box-gray"/>
  <text x="1250" y="1414" class="box-mono">block index (V4)</text>
  <text x="1250" y="1438" class="box-tiny">num_indices</text>
  <text x="1250" y="1460" class="box-tiny">[chrom_len][chrom][start_pos][end_pos][file_offset][variant_count] × N</text>

  <rect x="1880" y="1384" width="360" height="92" class="box-gray"/>
  <text x="1900" y="1414" class="box-mono">footer_offset @ EOF</text>
  <text x="1900" y="1438" class="box-tiny">文件最后 8 字节</text>
  <text x="1900" y="1460" class="box-tiny-bold">reader 先 seek 到 EOF 回读这个偏移。</text>

  <rect x="80" y="1640" width="2240" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="1663" class="box-tiny">源码依据：src/gvcf/gvcf_compressor.cpp::WriteFileHeader()/CompressAndWriteBlock()/WriteFileFooter(), src/gvcf/gvcf_block.cpp, src/gvcf/gvcf_field_compress.cpp, src/gvcf/gvcf_encoding.cpp</text>
</svg>
