<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif; fill: #000000; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .title { font-size: 42px; font-weight: bold; }
      .subtitle { font-size: 20px; fill: #333333; }
      .panel-title { font-size: 28px; font-weight: bold; }
      .panel-desc { font-size: 16px; font-style: italic; fill: #555555; }
      .box-title { font-size: 21px; font-weight: bold; }
      .box-text { font-size: 15px; fill: #333333; }
      .box-tiny { font-size: 13px; fill: #333333; }
      .box-tiny-bold { font-size: 13px; font-weight: bold; }
      .box-mono { font-size: 14px; font-weight: bold; }
      .legend-text { font-size: 12px; fill: #333333; }
      .flow-arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow-solid); stroke-linecap: round; stroke-linejoin: round; }
      .flow-dashed { stroke: #666666; stroke-width: 1.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-dashed); stroke-linecap: round; stroke-linejoin: round; }
      .panel-border { stroke: #000000; stroke-width: 2.5; fill: #ffffff; }
      .box-border { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .box-gray { fill: #f5f5f5; stroke: #000000; stroke-width: 1.5; }
      .box-dark-gray { fill: #e0e0e0; stroke: #000000; stroke-width: 1.5; }
    </style>
    <marker id="arrow-solid" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#000000"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 L4.5,6 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="2400" height="1700" fill="#ffffff"/>

  <rect x="80" y="60" width="2240" height="120" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="140" y="114" class="title">单样本 native gVCF 二进制结构</text>
  <text x="140" y="150" class="subtitle">对应 Excel：gVCF层次结构 / gVCF_native二进制结构。重点看：显式文件头、重复 block envelope、footer_offset 回跳索引。</text>
  <rect x="1845" y="88" width="435" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="1872" cy="113" r="5" fill="#000000"/>
  <text x="1888" y="118" class="legend-text">必选</text>
  <circle cx="1975" cy="113" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1991" y="118" class="legend-text">版本/条件</text>
  <line x1="2108" y1="113" x2="2160" y2="113" class="flow-dashed"/>
  <text x="2172" y="118" class="legend-text">引用/跳转</text>
  <text x="1870" y="140" class="legend-text">横向轴表示文件从起点到 EOF 的顺序。</text>

  <rect x="80" y="220" width="2240" height="1390" class="panel-border"/>
  <rect x="120" y="260" width="16" height="40" fill="#000000"/>
  <text x="150" y="290" class="panel-title">文件字节轴：Header -> Blocks -> Footer -> EOF 指针</text>
  <text x="150" y="320" class="panel-desc">native gVCF 与多样本 .gsc 不同：它有 GVCF magic/version，并通过文件尾 8 字节回读 footer。</text>

  <rect x="130" y="360" width="2140" height="240" class="box-border"/>
  <text x="160" y="397" class="box-title">一维物理布局</text>
  <text x="160" y="425" class="box-text">从左到右就是磁盘写入顺序；BLOCK_AREA 中每个 block 都自带长度前缀。</text>

  <rect x="170" y="462" width="370" height="100" class="box-dark-gray"/>
  <text x="355" y="496" text-anchor="middle" class="box-mono">FILE_HEADER</text>
  <text x="355" y="522" text-anchor="middle" class="box-tiny">magic/version/backend/header/sample</text>
  <circle cx="516" cy="490" r="5" fill="#000000"/>

  <path d="M540 512 L605 512" class="flow-arrow"/>

  <rect x="615" y="435" width="780" height="154" class="box-border"/>
  <text x="650" y="472" class="box-mono">BLOCK_AREA：重复 N 次</text>
  <rect x="650" y="498" width="170" height="52" class="box-gray"/>
  <text x="735" y="531" text-anchor="middle" class="box-tiny-bold">block_size</text>
  <rect x="840" y="498" width="260" height="52" class="box-dark-gray"/>
  <text x="970" y="531" text-anchor="middle" class="box-tiny-bold">CompressedGVCFBlock</text>
  <rect x="1120" y="498" width="70" height="52" class="box-gray"/>
  <text x="1155" y="531" text-anchor="middle" class="box-tiny-bold">...</text>
  <rect x="1210" y="498" width="150" height="52" class="box-gray"/>
  <text x="1285" y="531" text-anchor="middle" class="box-tiny-bold">block N</text>
  <circle cx="1370" cy="463" r="5" fill="#000000"/>

  <path d="M1395 512 L1480 512" class="flow-arrow"/>

  <rect x="1490" y="462" width="360" height="100" class="box-border"/>
  <text x="1670" y="496" text-anchor="middle" class="box-mono">FILE_FOOTER</text>
  <text x="1670" y="522" text-anchor="middle" class="box-tiny">block_offsets + total_variants + index</text>
  <circle cx="1826" cy="490" r="5" fill="#000000"/>

  <path d="M1850 512 L1935 512" class="flow-arrow"/>

  <rect x="1945" y="462" width="260" height="100" class="box-dark-gray"/>
  <text x="2075" y="496" text-anchor="middle" class="box-mono">footer_offset @ EOF</text>
  <text x="2075" y="522" text-anchor="middle" class="box-tiny">最后 8 bytes: uint64_t</text>
  <circle cx="2180" cy="490" r="5" fill="#000000"/>

  <path d="M2075 562 L2075 625 L2015 625 L2015 675" class="flow-dashed"/>
  <path d="M970 550 L970 625 L1220 625 L1220 675" class="flow-dashed"/>

  <rect x="130" y="655" width="570" height="410" class="box-border"/>
  <rect x="130" y="655" width="570" height="48" class="box-dark-gray"/>
  <text x="160" y="687" class="box-title">FILE_HEADER 展开</text>
  <text x="160" y="735" class="box-text">reader 先检查 GVCF_FILE_MAGIC，再按 version 读取后续字段。</text>

  <rect x="165" y="765" width="500" height="70" class="box-gray"/>
  <text x="185" y="794" class="box-mono">固定入口</text>
  <text x="185" y="818" class="box-tiny">magic = 0x47564346 ("GVCF"), version = 4, backend_id, num_samples</text>

  <rect x="165" y="855" width="500" height="82" class="box-gray"/>
  <text x="185" y="884" class="box-mono">header text</text>
  <text x="185" y="908" class="box-tiny">V3+：header_flag 决定 compressed/raw 两条分支</text>
  <circle cx="640" cy="880" r="5" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <rect x="165" y="957" width="500" height="70" class="box-gray"/>
  <text x="185" y="986" class="box-mono">sample_names + placeholder</text>
  <text x="185" y="1010" class="box-tiny">重复 [name_size][name]；最后补一个 uint64 占位</text>

  <rect x="740" y="655" width="960" height="530" class="box-border"/>
  <rect x="740" y="655" width="960" height="48" class="box-dark-gray"/>
  <text x="770" y="687" class="box-title">CompressedGVCFBlock 解剖图</text>
  <text x="770" y="735" class="box-text">每个 block_payload 内部再次声明 block magic/version，并把所有字段包装成 CompressedField。</text>

  <rect x="780" y="770" width="260" height="138" class="box-gray"/>
  <text x="800" y="800" class="box-mono">block header</text>
  <text x="800" y="826" class="box-tiny">4-byte block magic</text>
  <text x="800" y="848" class="box-tiny">block_version</text>
  <text x="800" y="870" class="box-tiny">variant_count</text>
  <text x="800" y="892" class="box-tiny">sample_count, flags</text>

  <path d="M1040 839 L1095 839" class="flow-arrow"/>

  <rect x="1105" y="770" width="265" height="138" class="box-gray"/>
  <text x="1125" y="800" class="box-mono">known fields</text>
  <text x="1125" y="826" class="box-tiny">chrom, pos, id, ref, alt</text>
  <text x="1125" y="848" class="box-tiny">qual, filter, info_end</text>
  <text x="1125" y="870" class="box-tiny">gt_*, dp, gq, min_dp</text>
  <text x="1125" y="892" class="box-tiny">pl, ad</text>

  <path d="M1370 839 L1425 839" class="flow-arrow"/>

  <rect x="1435" y="770" width="225" height="138" class="box-gray"/>
  <text x="1455" y="800" class="box-mono">unknown fields</text>
  <text x="1455" y="826" class="box-tiny">unknown_info_count</text>
  <text x="1455" y="848" class="box-tiny">unknown_info items</text>
  <text x="1455" y="870" class="box-tiny">unknown_format_count</text>
  <text x="1455" y="892" class="box-tiny">unknown_format items</text>

  <rect x="780" y="955" width="880" height="90" class="box-dark-gray"/>
  <text x="800" y="988" class="box-mono">字段统一包装</text>
  <text x="800" y="1014" class="box-tiny-bold">CompressedField = method + original_count + data_size + data</text>
  <text x="800" y="1036" class="box-tiny">data 内部可再带 backend_flag，用于区分 raw field payload 与 backend-compressed payload。</text>

  <path d="M1220 1045 L1220 1100" class="flow-dashed"/>

  <rect x="780" y="1110" width="880" height="48" class="box-border"/>
  <text x="800" y="1141" class="box-tiny-bold">注意：unknown_info / unknown_format 使用 unordered_map 迭代，字段写出顺序不保证按名称排序。</text>

  <rect x="1750" y="655" width="520" height="530" class="box-border"/>
  <rect x="1750" y="655" width="520" height="48" class="box-dark-gray"/>
  <text x="1780" y="687" class="box-title">FILE_FOOTER 与回跳索引</text>
  <text x="1780" y="735" class="box-text">解压或查询时先从 EOF 回读 footer_offset，再 seek 到 footer。</text>

  <rect x="1785" y="770" width="450" height="90" class="box-gray"/>
  <text x="1805" y="800" class="box-mono">footer fixed area</text>
  <text x="1805" y="824" class="box-tiny">num_blocks + block_offsets[] + total_variants</text>
  <text x="1805" y="846" class="box-tiny">block_offsets 指向各 block_size 字段</text>

  <rect x="1785" y="890" width="450" height="112" class="box-gray"/>
  <text x="1805" y="920" class="box-mono">block index (V4)</text>
  <text x="1805" y="944" class="box-tiny">num_indices</text>
  <text x="1805" y="966" class="box-tiny">[chrom_len][chrom][start_pos][end_pos]</text>
  <text x="1805" y="988" class="box-tiny">[file_offset][variant_count] × N</text>

  <rect x="1785" y="1032" width="450" height="88" class="box-dark-gray"/>
  <text x="1805" y="1062" class="box-mono">footer_offset @ EOF</text>
  <text x="1805" y="1086" class="box-tiny">文件最后 8 字节保存 footer 起始偏移</text>
  <text x="1805" y="1108" class="box-tiny-bold">这是 native gVCF 范围查询的入口。</text>

  <rect x="130" y="1225" width="2140" height="300" class="box-border"/>
  <rect x="130" y="1225" width="2140" height="48" class="box-dark-gray"/>
  <text x="160" y="1257" class="box-title">CompressedField wrapper 与典型 payload</text>
  <text x="160" y="1305" class="box-text">Excel 明细里的 CompressedField wrapper 和 FIELD_PAYLOADS_AND_METHODS 对应这里。</text>

  <rect x="165" y="1338" width="430" height="132" class="box-gray"/>
  <text x="185" y="1368" class="box-mono">CompressedField wrapper</text>
  <text x="185" y="1394" class="box-tiny">1. method : uint8 FieldCompressionMethod</text>
  <text x="185" y="1416" class="box-tiny">2. original_count : VarUint</text>
  <text x="185" y="1438" class="box-tiny">3. data_size : VarUint</text>
  <text x="185" y="1460" class="box-tiny-bold">4. data : bytes</text>

  <path d="M595 1404 L670 1404" class="flow-arrow"/>

  <rect x="680" y="1338" width="510" height="132" class="box-gray"/>
  <text x="700" y="1368" class="box-mono">data 内部 backend wrapper</text>
  <text x="700" y="1394" class="box-tiny">第 1 字节是 backend_flag：</text>
  <text x="700" y="1416" class="box-tiny">0 = 后面直接跟字段编码 payload</text>
  <text x="700" y="1438" class="box-tiny">1 = 后面跟 backend-compressed payload</text>
  <text x="700" y="1460" class="box-tiny-bold">空字段 data_size=0 时没有 backend_flag。</text>

  <path d="M1190 1404 L1265 1404" class="flow-arrow"/>

  <rect x="1275" y="1338" width="950" height="132" class="box-gray"/>
  <text x="1295" y="1368" class="box-mono">典型字段 payload 例子</text>
  <text x="1295" y="1394" class="box-tiny">POS: Delta [original_len][first_value][delta_count][delta...]</text>
  <text x="1295" y="1416" class="box-tiny">REF: exception list + packed 2-bit bases；ALT: Mask(first ALT) + extra_alts 列表</text>
  <text x="1295" y="1438" class="box-tiny">PL/AD: optimized v2 payload；GQ: PL prediction exceptions</text>
  <text x="1295" y="1460" class="box-tiny">RLE / Delta / Mask / Dictionary 等基础编码由 gvcf_encoding.* 实现。</text>

  <rect x="80" y="1640" width="2240" height="34" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="110" y="1663" class="box-tiny">源码依据：src/gvcf/gvcf_compressor.cpp::WriteFileHeader()/CompressAndWriteBlock()/WriteFileFooter(), src/gvcf/gvcf_block.cpp, src/gvcf/gvcf_field_compress.cpp, src/gvcf/gvcf_encoding.cpp</text>
</svg>
